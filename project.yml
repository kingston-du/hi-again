# Generates HiAgain.xcodeproj. After adding files outside HiAgain/, run: xcodegen generate
name: HiAgain
options:
  bundleIdPrefix: com.kingston
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  HiAgain:
    type: application
    platform: iOS
    sources:
      - path: HiAgain
        type: syncedFolder
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingston.HiAgain
        DEVELOPMENT_TEAM: NNQ4DT9Z7Q
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/HiAgain.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  HiAgain:
    build:
      targets:
        HiAgain: all
    run:
      config: Debug
